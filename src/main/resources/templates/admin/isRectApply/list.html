<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('隐患整改申请审批')"/>
</head>
<body class="pear-container">

<!-- 统计亮屏：已作废单不参与任何统计 -->
<div class="layui-card">
    <div class="layui-card-body">
        <div class="layui-row layui-col-space10">
            <div class="layui-col-xs3">
                <div class="layui-card" style="border-left:4px solid #FF5722;">
                    <div class="layui-card-header">我的待签</div>
                    <div class="layui-card-body">
                        <span id="stat-mytodo" style="font-size:28px;color:#FF5722;">0</span> 张
                    </div>
                </div>
            </div>
            <div class="layui-col-xs3">
                <div class="layui-card" style="border-left:4px solid #FFB800;">
                    <div class="layui-card-header">审批中</div>
                    <div class="layui-card-body">
                        <span id="stat-running" style="font-size:28px;color:#FFB800;">0</span> 张
                    </div>
                </div>
            </div>
            <div class="layui-col-xs3">
                <div class="layui-card" style="border-left:4px solid #16b777;">
                    <div class="layui-card-header">已通过</div>
                    <div class="layui-card-body">
                        <span id="stat-pass" style="font-size:28px;color:#16b777;">0</span> 张
                    </div>
                </div>
            </div>
            <div class="layui-col-xs3">
                <div class="layui-card" style="border-left:4px solid #1E9FFF;">
                    <div class="layui-card-header">未提交/已驳回</div>
                    <div class="layui-card-body" style="font-size:13px;">
                        未提交 <b id="stat-draft">0</b> 　已驳回 <b id="stat-reject">0</b>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form" action="">
            <div class="layui-form-item">
                <label class="layui-form-label">状态</label>
                <div class="layui-input-inline">
                    <select name="status" class="layui-input">
                        <option value="">全部（不含已作废）</option>
                        <option value="0">未提交</option>
                        <option value="1">审批中</option>
                        <option value="2">已通过</option>
                        <option value="3">已驳回</option>
                        <option value="4">已作废（归档/撤回）</option>
                    </select>
                </div>
                <label class="layui-form-label">申请人</label>
                <div class="layui-input-inline">
                    <input type="text" name="applicant" class="layui-input" placeholder="登录账号"/>
                </div>
                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="ra-query">
                    <i class="layui-icon layui-icon-search"></i> 查询
                </button>
                <button type="reset" class="pear-btn pear-btn-md">
                    <i class="layui-icon layui-icon-refresh"></i> 重置
                </button>
                <button class="pear-btn pear-btn-md" lay-submit lay-filter="ra-todo" style="margin-left:16px;">
                    <i class="layui-icon layui-icon-username"></i> 只看我的待签
                </button>
                <button shiro:hasPermission="isRectApply:create" class="pear-btn pear-btn-md pear-btn-success" lay-submit lay-filter="ra-create">
                    <i class="layui-icon layui-icon-add-1"></i> 新建申请
                </button>
                <button shiro:hasPermission="isRectApply:urge" class="pear-btn pear-btn-md pear-btn-warming" lay-submit lay-filter="ra-urge">
                    <i class="layui-icon layui-icon-notice"></i> 立即催办
                </button>
            </div>
        </form>
    </div>
</div>

<div class="layui-card">
    <div class="layui-card-body">
        <table id="ra-table" lay-filter="ra-table"></table>
    </div>
</div>

<script type="text/html" id="ra-status">
    {{#  if(d.status===0){ }}<span class="layui-badge layui-bg-gray">未提交</span>
    {{#  } else if(d.status===1){ }}<span class="layui-badge layui-bg-orange">审批中</span>
    {{#  } else if(d.status===2){ }}<span class="layui-badge layui-bg-green">已通过</span>
    {{#  } else if(d.status===3){ }}<span class="layui-badge">已驳回</span>
    {{#  } else if(d.status===4){ }}<span class="layui-badge layui-bg-black">已作废</span>{{#  } }}
</script>

<script type="text/html" id="ra-grade">
    {{#  if(d.hazardGrade===2){ }}<span style="color:#FF5722;">重大隐患</span>
    {{#  } else if(d.hazardGrade===1){ }}一般隐患
    {{#  } else { }}—{{#  } }}
</script>

<script type="text/html" id="ra-level">
    {{#  if(d.status===1 && d.curLevelName){ }}
    <div><b>{{d.curLevelName}}</b>（第{{d.curLevelNo+1}}级）</div>
    <div style="color:#888;font-size:12px;">该签：{{d.curSigner}}　已停 {{d.stayHours||0}} 时</div>
    {{#  } else { }}—{{#  } }}
</script>

<script type="text/html" id="ra-bar">
    <button shiro:hasPermission="isRectApply:list" class="pear-btn pear-btn-primary pear-btn-sm" lay-event="trace">单况/意见</button>
    <button shiro:hasPermission="isRectApply:submit" class="pear-btn pear-btn-sm" lay-event="submit">提交</button>
    <button shiro:hasPermission="isRectApply:sign" class="pear-btn pear-btn-warming pear-btn-sm" lay-event="sign">签收</button>
    <button shiro:hasPermission="isRectApply:submit" class="pear-btn pear-btn-sm" lay-event="withdraw">撤回</button>
    <button shiro:hasPermission="isRectApply:archive" class="pear-btn pear-btn-danger pear-btn-sm" lay-event="archive">归档</button>
</script>

<th:block th:include="include :: footer"/>
<script>
    layui.use(['table', 'form', 'jquery', 'layer'], function () {
        let table = layui.table, form = layui.form, $ = layui.jquery, layer = layui.layer;
        let MP = rootPath + "/isRectApply/";
        let todoOnly = false;

        table.render({
            elem: '#ra-table',
            url: MP + 'list',
            method: 'get',
            page: true,
            skin: 'line',
            cols: [[
                {field: 'applyNo', title: '申请单号', width: 160},
                {field: 'hazardNo', title: '隐患号', width: 120},
                {field: 'hazardGrade', title: '级别', width: 90, align: 'center', templet: '#ra-grade'},
                {field: 'hazardSummary', title: '隐患概况', minWidth: 200},
                {field: 'applicant', title: '申请人', width: 100},
                {field: 'submitTime', title: '提交时间', width: 165, align: 'center'},
                {title: '当前待签层级/谁该签', width: 210, align: 'center', templet: '#ra-level'},
                {field: 'roundNo', title: '轮次', width: 70, align: 'center'},
                {field: 'urgeRounds', title: '催办', width: 70, align: 'center'},
                {field: 'status', title: '状态', width: 90, align: 'center', templet: '#ra-status'},
                {field: 'closedAt', title: '结案时间', width: 165, align: 'center'},
                {title: '操作', width: 300, align: 'center', fixed: 'right', toolbar: '#ra-bar'}
            ]]
        });

        function reload(where) {
            table.reload('ra-table', {url: MP + (todoOnly ? 'todo' : 'list'), where: where || {}, page: {curr: 1}});
        }

        form.on('submit(ra-query)', function (data) {
            todoOnly = false;
            reload(data.field);
            return false;
        });
        form.on('submit(ra-todo)', function () {
            todoOnly = true;
            reload({});
            return false;
        });

        // 新建草稿：隐患 ID + 级别
        form.on('submit(ra-create)', function () {
            layer.prompt({title: '关联隐患ID（t_is_hazard）', formType: 0}, function (hazardId, i1) {
                layer.prompt({title: '隐患级别：1 一般隐患 / 2 重大隐患', value: '1', formType: 0}, function (grade, i2) {
                    $.post(MP + 'create', {hazardId: hazardId, hazardGrade: grade}, function (r) {
                        layer.close(i1); layer.close(i2);
                        layer.msg(r.msg, {icon: r.code === 200 ? 1 : 2});
                        if (r.code === 200) table.reload('ra-table');
                    });
                });
            });
            return false;
        });

        // 立即催办
        form.on('submit(ra-urge)', function () {
            let loading = layer.load();
            $.post(MP + 'urge', {}, function (r) {
                layer.close(loading);
                layer.msg(r.msg, {icon: r.code === 200 ? 1 : 2});
                if (r.code === 200) table.reload('ra-table');
            });
            return false;
        });

        // 签收弹窗：动作/意见/代办/转交
        function openSign(d) {
            let html = '<form class="layui-form" style="padding:20px 20px 0;" lay-filter="sign-form">'
                + '<div class="layui-form-item"><label class="layui-form-label">动作</label><div class="layui-input-block">'
                + '<select name="action" lay-filter="sign-action">'
                + '<option value="PASS">通过</option><option value="REJECT">驳回</option>'
                + '<option value="SUPPLEMENT">补充材料</option><option value="TRANSFER">转交他级</option>'
                + '</select></div></div>'
                + '<div class="layui-form-item" id="row-target" style="display:none;"><label class="layui-form-label">转交层级</label>'
                + '<div class="layui-input-block"><input name="targetLevelNo" class="layui-input" placeholder="目标层级 level_no（不是本级）"/></div></div>'
                + '<div class="layui-form-item"><label class="layui-form-label">本级意见</label>'
                + '<div class="layui-input-block"><textarea name="opinion" class="layui-textarea" placeholder="签自己的意见；转交也要把本级处理意见记全，不许只留一句转走了"></textarea></div></div>'
                + '<div class="layui-form-item"><label class="layui-form-label">代办人</label>'
                + '<div class="layui-input-inline" style="width:120px;"><input name="operator" class="layui-input" placeholder="本人签留空" readonly/></div>'
                + '<label class="layui-form-label" style="width:90px;">原签署人</label>'
                + '<div class="layui-input-inline" style="width:120px;"><input name="agentFor" class="layui-input" placeholder="非代办留空"/></div></div>'
                + '<div class="layui-form-item"><label class="layui-form-label">代办原因</label>'
                + '<div class="layui-input-block"><input name="agentReason" class="layui-input" placeholder="代办必须写明代办人、原签署人和原因"/></div></div>'
                + '<div class="layui-form-item" style="color:#999;font-size:12px;">代办不等于换人：该级法定签署人仍按平台配置，代办只在留痕里记三要素。</div>'
                + '</form>';
            layer.open({
                type: 1, title: '签收 ' + d.applyNo + '（当前：' + d.curLevelName + '）', area: ['600px', '560px'],
                content: html, btn: ['确定签收', '取消'],
                success: function () { form.render(null, 'sign-form');
                    form.on('select(sign-action)', function (sd) {
                        $('#row-target').css('display', sd.value === 'TRANSFER' ? '' : 'none');
                    });
                },
                yes: function (idx) {
                    let f = {};
                    $('[lay-filter="sign-form"]').serializeArray().forEach(function (p) { f[p.name] = p.value; });
                    $.post(MP + 'sign', {
                        id: d.id, action: f.action, opinion: f.opinion,
                        agentFor: f.agentFor, agentReason: f.agentReason, targetLevelNo: f.targetLevelNo
                    }, function (r) {
                        layer.msg(r.msg, {icon: r.code === 200 ? 1 : 2});
                        if (r.code === 200) { layer.close(idx); table.reload('ra-table'); refreshStats(); }
                    });
                }
            });
        }

        table.on('tool(ra-table)', function (obj) {
            let d = obj.data;
            if (obj.event === 'trace') {
                $.get(MP + 'detail', {id: d.id}, function (r) {
                    if (r.code !== 200) { layer.msg(r.msg, {icon: 2}); return; }
                    let a = r.data.apply, signs = r.data.signs, urges = r.data.urges, html = '';
                    html += '<div style="line-height:1.9;margin-bottom:8px;"><b>' + a.applyNo + '</b>　'
                        + '<span class="layui-badge layui-bg-orange">' + ['未提交','审批中','已通过','已驳回','已作废'][a.status] + '</span><br>'
                        + '隐患：' + (a.hazardNo || '') + '（' + (a.hazardGrade === 2 ? '重大隐患' : '一般隐患') + '）'
                        + (a.hazardSummary ? ' ' + a.hazardSummary : '') + '<br>'
                        + '申请人：' + a.applicant + '　提交：' + (a.submitTime || '—') + '　轮次：' + (a.roundNo || 1) + '<br>'
                        + '当前待签：' + (a.curLevelName ? a.curLevelName + '，该 ' + a.curSigner + ' 签' : '—')
                        + (a.closedAt ? '<br>结案：' + a.closedAt + '　结论（写死）：' + (a.conclusion || '') : '')
                        + '</div><hr><table class="layui-table" style="margin:0;font-size:12px;"><thead><tr>'
                        + '<th>轮次</th><th>层级</th><th>动作</th><th>意见</th><th>签署人</th><th>代办留痕</th><th>时刻</th></tr></thead><tbody>';
                    let actName = {SUBMIT:'提交', PASS:'通过', REJECT:'驳回', SUPPLEMENT:'补充材料', TRANSFER:'转交他级'};
                    signs.forEach(function (s) {
                        let agent = s.agentFor ? ('代办：' + s.signer + ' 代 ' + s.agentFor + '；原因：' + s.agentReason) : '—';
                        html += '<tr><td>第' + s.roundNo + '轮</td><td>' + (s.levelName || '') + '</td>'
                            + '<td>' + (actName[s.action] || s.action) + '</td><td>' + (s.opinion || '') + '</td>'
                            + '<td>' + (s.signer || '') + '</td><td>' + agent + '</td><td>' + (s.signTime || '') + '</td></tr>';
                    });
                    if (!signs.length) { html += '<tr><td colspan="7">暂无签署记录</td></tr>'; }
                    html += '</tbody></table>';
                    if (urges.length) {
                        html += '<hr><div style="font-weight:bold;margin-bottom:6px;">催办留痕</div>'
                            + '<table class="layui-table" style="margin:0;font-size:12px;"><thead><tr><th>时刻</th><th>层级</th><th>被催办人</th><th>已停时</th><th>事由</th></tr></thead><tbody>';
                        urges.forEach(function (u) {
                            html += '<tr><td>' + u.urgedAt + '</td><td>' + u.levelName + '</td><td>' + u.signer
                                + '</td><td>' + u.stayHours + '时</td><td>' + (u.detail || '') + '</td></tr>';
                        });
                        html += '</tbody></table>';
                    }
                    layer.open({type: 1, title: '申请单单况与逐级意见', area: ['860px', '580px'], content: html});
                });
            } else if (obj.event === 'submit') {
                if (d.status !== 0) { layer.msg('只有未提交的单能提交（补材料退回的补齐后从此重走第一级）', {icon: 2}); return; }
                layer.prompt({title: '提交说明（将进第一级）', formType: 2}, function (opinion, idx) {
                    $.post(MP + 'submit', {id: d.id, opinion: opinion}, function (r) {
                        layer.close(idx);
                        layer.msg(r.msg, {icon: r.code === 200 ? 1 : 2});
                        if (r.code === 200) table.reload('ra-table');
                    });
                });
            } else if (obj.event === 'sign') {
                if (d.status !== 1) { layer.msg('只有审批中的单能签收', {icon: 2}); return; }
                openSign(d);
            } else if (obj.event === 'withdraw') {
                if (d.status !== 0) { layer.msg('撤回只许在还没进任何一级签署前；签收中途有异议走驳回', {icon: 2}); return; }
                layer.prompt({title: '撤回原因（撤回即作废，不入统计待办）', formType: 2}, function (reason, idx) {
                    $.post(MP + 'withdraw', {id: d.id, reason: reason}, function (r) {
                        layer.close(idx);
                        layer.msg(r.msg, {icon: r.code === 200 ? 1 : 2});
                        if (r.code === 200) table.reload('ra-table');
                    });
                });
            } else if (obj.event === 'archive') {
                if (d.status !== 2 && d.status !== 3) { layer.msg('只有已结案（通过/驳回）的单能归档', {icon: 2}); return; }
                layer.confirm('归档后该单作废、不再参与统计和待办；结论与结案时间原样保留。确定？', function (idx) {
                    $.post(MP + 'archive', {id: d.id}, function (r) {
                        layer.close(idx);
                        layer.msg(r.msg, {icon: r.code === 200 ? 1 : 2});
                        if (r.code === 200) table.reload('ra-table');
                    });
                });
            }
        });

        function refreshStats() {
            $.get(MP + 'stats', {}, function (r) {
                let s = r.data;
                if (!s) { return; }
                $('#stat-mytodo').text(s.myTodo);
                $('#stat-running').text(s.running);
                $('#stat-pass').text(s.pass);
                $('#stat-draft').text(s.draft);
                $('#stat-reject').text(s.reject);
            });
        }
        refreshStats();
    });
</script>
</body>
</html>
